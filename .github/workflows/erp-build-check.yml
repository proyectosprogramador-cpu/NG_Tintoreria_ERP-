name: Verificacion de compilacion ERP

on:
  push:
    branches:
      - feature/alta-rapida-insumos-compras-20261108
  pull_request:
    branches:
      - cloud-full

jobs:
  backend:
    name: Pruebas backend (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Ejecutar pruebas unitarias
        run: mvn -B -f backend/pom.xml test

  frontend:
    name: Compilar frontend (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias reproducibles
        run: npm ci
        working-directory: frontend
      - name: Validar TypeScript y compilar Vite
        run: npm run build
        working-directory: frontend
