services:
  db:
    image: postgres:16-alpine
    container_name: ng_tintoreria_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ng_tintoreria}
      POSTGRES_USER: ${POSTGRES_USER:-ngerp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ngerp_local_2026}
    volumes:
      - ng_tintoreria_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ngerp} -d ${POSTGRES_DB:-ng_tintoreria}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: ng_tintoreria_backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-ng_tintoreria}
      DB_USER: ${POSTGRES_USER:-ngerp}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ngerp_local_2026}
      ERP_JWT_SECRET: ${ERP_JWT_SECRET:-NGTintoreriaERP-Local-Secret-Change-2026-Strong-Key}
      ERP_JWT_EXPIRATION_MINUTES: ${ERP_JWT_EXPIRATION_MINUTES:-480}
      ERP_MAX_LOGIN_ATTEMPTS: ${ERP_MAX_LOGIN_ATTEMPTS:-5}
      ERP_LOGIN_LOCK_MINUTES: ${ERP_LOGIN_LOCK_MINUTES:-15}
      ERP_BOOTSTRAP_ADMIN_EMAIL: ${ERP_BOOTSTRAP_ADMIN_EMAIL:-admin@ng.local}
      ERP_BOOTSTRAP_ADMIN_PASSWORD: ${ERP_BOOTSTRAP_ADMIN_PASSWORD:-Cambiar-2026!}
      ERP_BOOTSTRAP_ADMIN_NAME: ${ERP_BOOTSTRAP_ADMIN_NAME:-Neul Guzman}
      ERP_STORAGE_ROOT: /app/data/files
      COPILOT_LLM_ENABLED: ${COPILOT_LLM_ENABLED:-false}
      COPILOT_LLM_BASE_URL: ${COPILOT_LLM_BASE_URL:-}
      COPILOT_LLM_API_KEY: ${COPILOT_LLM_API_KEY:-}
      COPILOT_LLM_MODEL: ${COPILOT_LLM_MODEL:-}
      COPILOT_NOTIFY_ENABLED: ${COPILOT_NOTIFY_ENABLED:-true}
      COPILOT_NOTIFY_DRY_RUN: ${COPILOT_NOTIFY_DRY_RUN:-true}
      COPILOT_NOTIFY_SCAN_MS: ${COPILOT_NOTIFY_SCAN_MS:-60000}
      COPILOT_NOTIFY_EMAIL_FROM: ${COPILOT_NOTIFY_EMAIL_FROM:-no-reply@ng.local}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      COPILOT_WHATSAPP_WEBHOOK_URL: ${COPILOT_WHATSAPP_WEBHOOK_URL:-}
      COPILOT_WHATSAPP_WEBHOOK_TOKEN: ${COPILOT_WHATSAPP_WEBHOOK_TOKEN:-}
    volumes:
      - ng_tintoreria_files:/app/data/files
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ./frontend
    container_name: ng_tintoreria_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PORT: "80"
    volumes:
      # En Windows/LAN usar proxy al backend LOCAL, nunca al backend de Render.
      - ./frontend/nginx.local.conf:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${ERP_PORT:-8080}:80"

volumes:
  ng_tintoreria_pgdata:
  ng_tintoreria_files:
